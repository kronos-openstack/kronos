name: Release

# Pushing a v* tag builds the sdist + wheel, signs them with sigstore,
# attaches everything to a GitHub release, and publishes to PyPI via
# OIDC trusted publishing (no API token stored in the repo; configure
# the trusted publisher on PyPI: repository kronos-openstack/kronos,
# workflow release.yml, environment pypi).

on:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # setuptools-scm derives the version from the tag
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # OIDC trusted publishing
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          attestations: true

  sign-and-release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      # sigstore OIDC identity + release upload
      id-token: write
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/
      - uses: sigstore/gh-action-sigstore-python@f7ad0af51a5648d09a20d00370f0a91c3bdf8f84 # v3.0.1
        with:
          inputs: dist/*.tar.gz dist/*.whl
          upload-signing-artifacts: true
      # The sigstore action only attaches files to a release that
      # already exists, so create the release here with the dist files
      # and the .sigstore.json bundles the previous step wrote.
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kronos ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            dist/*.tar.gz dist/*.whl dist/*.sigstore.json
