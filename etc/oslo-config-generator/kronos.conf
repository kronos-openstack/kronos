# oslo-config-generator definition for the full Kronos config
# reference. Regenerate after adding or changing options:
#
#   pip install -e .
#   oslo-config-generator --config-file etc/oslo-config-generator/kronos.conf
#
# The output is checked in at docs/configuration/kronos.conf.sample so
# the complete reference (including the oslo.log / oslo.messaging /
# keystoneauth1 inherited options) stays grep-able in the repo. The
# hand-curated quickstart sample lives at etc/kronos/kronos.conf.sample.
[DEFAULT]
output_file = docs/configuration/kronos.conf.sample
wrap_width = 79
namespace = kronos
namespace = oslo.log
namespace = oslo.messaging
